<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 295" width="800" height="295" role="img" aria-label="Comparison showing why raw errors cancel to zero while MSE and MAE catch the 20-hour mistakes. Actual ticket resolution is 30 hours. Ticket A predicts 10 hours (error -20) and Ticket B predicts 50 hours (error +20). Their signed mean is 0.0 hours, whereas MSE computes 400.0 and MAE computes 20.0.">
  <title>Why signed prediction errors cancel to zero when averaged</title>

  <rect x="0.5" y="0.5" width="799" height="294" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />

  <!-- Header -->
  <text x="400" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Why raw errors cancel out while squared and absolute losses do not</text>
  <text x="400" y="47" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Actual ticket duration = 30 hours: missing low by 20h and high by 20h hides completely in a plain mean</text>

  <!-- LEFT CARD: Number line showing -20 and +20 canceling -->
  <rect x="28" y="68" width="440" height="178" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
  <text x="248" y="92" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Error e = prediction - target (in hours)</text>

  <!-- Number line: e=0 at 248, e=-20 at 98, e=+20 at 398 -->
  <line x1="68" y1="158" x2="428" y2="158" stroke="#94a3b8" stroke-width="2" />
  <line x1="248" y1="142" x2="248" y2="174" stroke="#0f172a" stroke-width="2" />
  <text x="248" y="190" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#0f172a">0 (exact)</text>

  <!-- -20 arrow left -->
  <line x1="244" y1="158" x2="108" y2="158" stroke="#d97706" stroke-width="4" />
  <polygon points="108,151 96,158 108,165" fill="#d97706" />
  <circle cx="98" cy="158" r="6" fill="#d97706" />
  <rect x="46" y="108" width="136" height="36" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1" />
  <text x="114" y="123" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#9a3412">Predicts 10h (target 30h)</text>
  <text x="114" y="137" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#b45309">e = -20 hours</text>

  <!-- +20 arrow right -->
  <line x1="252" y1="158" x2="388" y2="158" stroke="#0284c7" stroke-width="4" />
  <polygon points="388,151 400,158 388,165" fill="#0284c7" />
  <circle cx="398" cy="158" r="6" fill="#0284c7" />
  <rect x="314" y="108" width="136" height="36" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" />
  <text x="382" y="123" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#1e3a8a">Predicts 50h (target 30h)</text>
  <text x="382" y="137" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#0369a1">e = +20 hours</text>

  <!-- Cancel pill -->
  <rect x="44" y="204" width="408" height="28" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" />
  <text x="248" y="222" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.2" font-weight="700" fill="#b91c1c">Raw average: (-20 + 20) / 2 = 0.0 (hides both errors)</text>

  <!-- RIGHT CARD: Fixes (MSE & MAE) -->
  <rect x="490" y="68" width="282" height="178" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" />
  <text x="631" y="92" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#065f46">Strip the sign before averaging</text>

  <rect x="506" y="108" width="250" height="58" rx="7" fill="#ffffff" stroke="#a7f3d0" stroke-width="1" />
  <text x="518" y="127" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0369a1">Square each error (MSE)</text>
  <text x="518" y="144" font-family="ui-monospace, monospace" font-size="10.5" fill="#334155">((-20)^2 + 20^2) / 2 = 400.0 h^2</text>
  <text x="518" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">Non-negative, weights large misses heavily</text>

  <rect x="506" y="176" width="250" height="58" rx="7" fill="#ffffff" stroke="#a7f3d0" stroke-width="1" />
  <text x="518" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#047857">Take absolute value (MAE)</text>
  <text x="518" y="212" font-family="ui-monospace, monospace" font-size="10.5" fill="#334155">(|-20| + |20|) / 2 = 20.0 hours</text>
  <text x="518" y="226" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">Non-negative, grows linearly with error size</text>

  <!-- Footer -->
  <text x="400" y="274" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#334155">Both MSE and MAE guarantee zero loss happens only when every prediction actually hits its target.</text>
</svg>
