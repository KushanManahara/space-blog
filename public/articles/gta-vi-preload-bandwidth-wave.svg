<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="800" height="320" rx="14" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="799" height="319" rx="14" fill="none" stroke="#e2e8f0"/>

  <!-- Header -->
  <text x="400" y="30" text-anchor="middle" font-size="15.5" font-weight="700" fill="#0f172a">How a 210 GB console launch bent global internet traffic</text>
  <text x="400" y="49" text-anchor="middle" font-size="11.5" fill="#475569">PlayStation opened pre-loads 9 days early (Nov 10), yet DE-CIX still set back-to-back global throughput records</text>

  <!-- Left panel: Derived download volume -->
  <rect x="24" y="68" width="326" height="202" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="187" y="90" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">1. Pre-load data math (derived)</text>

  <rect x="40" y="103" width="294" height="46" rx="7" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="187" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">24.5M digital pre-orders x ~210 GB</text>
  <text x="187" y="139" text-anchor="middle" font-size="10.5" fill="#475569">Sensor Tower digital estimate x console install size</text>

  <line x1="187" y1="149" x2="187" y2="165" stroke="#3b82f6" stroke-width="2"/>
  <polygon points="182,162 192,162 187,169" fill="#3b82f6"/>

  <rect x="40" y="170" width="294" height="42" rx="7" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="187" y="188" text-anchor="middle" font-size="12.5" font-weight="700" fill="#047857">~5.14 exabytes of payload</text>
  <text x="187" y="204" text-anchor="middle" font-size="10.5" fill="#065f46">Over 5.1 million terabytes before physical discs</text>

  <rect x="40" y="220" width="294" height="38" rx="7" fill="#fefce8" stroke="#fde047"/>
  <text x="187" y="236" text-anchor="middle" font-size="11.5" font-weight="700" fill="#854d0e">Spread across 9 days = ~52.9 Tbps avg</text>
  <text x="187" y="251" text-anchor="middle" font-size="10" fill="#713f12">Global CDN + ISP average before launch-night spikes</text>

  <!-- Right panel: DE-CIX recorded peaks -->
  <rect x="366" y="68" width="410" height="202" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="571" y="90" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">2. DE-CIX global internet exchange peaks</text>

  <!-- Horizontal bars -->
  <!-- Baseline -->
  <text x="382" y="120" font-size="11" font-weight="600" fill="#475569">Typical early-2026 week</text>
  <rect x="382" y="126" width="218" height="20" rx="5" fill="#94a3b8"/>
  <text x="608" y="140" font-size="11" font-weight="700" fill="#475569">~26.4 Tbps baseline</text>

  <!-- Pre-load wave -->
  <text x="382" y="167" font-size="11" font-weight="600" fill="#1d4ed8">Nov 10 pre-load opens (Frankfurt 22.30 Tbps)</text>
  <rect x="382" y="173" width="272" height="20" rx="5" fill="#3b82f6"/>
  <text x="662" y="187" font-size="11" font-weight="700" fill="#1d4ed8">33.01 Tbps</text>

  <!-- Launch eve peak -->
  <text x="382" y="214" font-size="11" font-weight="700" fill="#b91c1c">Nov 18, 20:20 CET (launch eve all-time record)</text>
  <rect x="382" y="220" width="274" height="22" rx="5" fill="#dc2626"/>
  <text x="664" y="235" font-size="11.5" font-weight="700" fill="#b91c1c">33.03 Tbps</text>

  <text x="571" y="260" text-anchor="middle" font-size="10.5" font-weight="600" fill="#991b1b">+25% above normal global throughput across DE-CIX exchanges</text>

  <!-- Footer -->
  <text x="400" y="298" text-anchor="middle" font-size="11" fill="#475569">Measured peaks from DE-CIX press release (Nov 19, 2026), with payload volume derived from 24.5M pre-orders at 210 GB.</text>
</svg>
