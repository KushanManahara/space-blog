<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" width="800" height="310" role="img" aria-label="Two-panel diagram showing how maximum likelihood connects directly to summed cross-entropy losses. Left panel shows multiplying three independent ticket probabilities (0.90, 0.80, 0.95) to obtain 0.684, while warning that thousands of terms multiply below floating-point precision to zero. Right panel applies the negative logarithm to convert the product into an additive sum: 0.1054 + 0.2231 + 0.0513 = 0.3798.">
  <title>Why multiplying probabilities becomes summing negative log-likelihoods</title>

  <rect x="0.5" y="0.5" width="799" height="309" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />

  <!-- Header -->
  <text x="400" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Why loss functions take −ln: turning tiny products into additive sums</text>
  <text x="400" y="47" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Independent probabilities multiply in likelihood, whereas taking the log splits multiplication cleanly into addition</text>

  <line x1="398" y1="62" x2="398" y2="274" stroke="#e2e8f0" stroke-width="1" />

  <!-- LEFT PANEL -->
  <text x="199" y="75" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">1. Joint likelihood multiplies</text>
  <rect x="24" y="86" width="350" height="184" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />

  <!-- Three prob pills -->
  <rect x="42" y="102" width="84" height="36" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" />
  <text x="84" y="117" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#475569">Ticket 1</text>
  <text x="84" y="132" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#1d4ed8">p = 0.90</text>

  <text x="142" y="124" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#64748b">×</text>

  <rect x="157" y="102" width="84" height="36" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" />
  <text x="199" y="117" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#475569">Ticket 2</text>
  <text x="199" y="132" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#1d4ed8">p = 0.80</text>

  <text x="257" y="124" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#64748b">×</text>

  <rect x="272" y="102" width="84" height="36" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" />
  <text x="314" y="117" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#475569">Ticket 3</text>
  <text x="314" y="132" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#1d4ed8">p = 0.95</text>

  <!-- Product result -->
  <line x1="199" y1="142" x2="199" y2="160" stroke="#64748b" stroke-width="1.5" />
  <polygon points="195,159 199,167 203,159" fill="#64748b" />

  <rect x="92" y="169" width="214" height="30" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2" />
  <text x="199" y="188" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#1e3a8a">Likelihood L = 0.684</text>

  <!-- Underflow danger box -->
  <rect x="40" y="210" width="318" height="48" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" />
  <text x="199" y="229" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#991b1b">Problem across 1,000 tickets:</text>
  <text x="199" y="247" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#b91c1c">0.9^1000 ≈ 1.75×10⁻⁴⁶ -&gt; float32 stores 0.0</text>

  <!-- RIGHT PANEL -->
  <text x="600" y="75" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#065f46">2. Negative log sums safely</text>
  <rect x="422" y="86" width="354" height="184" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />

  <rect x="440" y="102" width="90" height="36" rx="6" fill="#ecfdf5" stroke="#86efac" stroke-width="1.2" />
  <text x="485" y="117" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#047857">-ln(0.90)</text>
  <text x="485" y="132" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#065f46">0.1054</text>

  <text x="543" y="124" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#059669">+</text>

  <rect x="556" y="102" width="90" height="36" rx="6" fill="#ecfdf5" stroke="#86efac" stroke-width="1.2" />
  <text x="601" y="117" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#047857">-ln(0.80)</text>
  <text x="601" y="132" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#065f46">0.2231</text>

  <text x="659" y="124" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#059669">+</text>

  <rect x="672" y="102" width="90" height="36" rx="6" fill="#ecfdf5" stroke="#86efac" stroke-width="1.2" />
  <text x="717" y="117" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#047857">-ln(0.95)</text>
  <text x="717" y="132" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#065f46">0.0513</text>

  <line x1="601" y1="142" x2="601" y2="160" stroke="#059669" stroke-width="1.5" />
  <polygon points="597,159 601,167 605,159" fill="#059669" />

  <rect x="480" y="169" width="242" height="30" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.3" />
  <text x="601" y="188" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#065f46">−ln(0.684) = 0.3798 (exact sum)</text>

  <rect x="438" y="210" width="324" height="48" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1" />
  <text x="600" y="229" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#065f46">Same 1,000 tickets after −ln:</text>
  <text x="600" y="247" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#047857">1,000 × 0.1054 = 105.4 (an ordinary safe number)</text>

  <!-- Footer -->
  <text x="400" y="295" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#334155">Because −ln flips probabilities upside down cleanly, cross-entropy turns product maximization into stable addition.</text>
</svg>
