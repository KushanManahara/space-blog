<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="800" height="340" rx="14" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="799" height="339" rx="14" fill="none" stroke="#e2e8f0"/>

  <!-- Header -->
  <text x="400" y="29" text-anchor="middle" font-size="15.5" font-weight="700" fill="#0f172a">RAGE 9 vs. console silicon: choosing simulation over 60 FPS</text>
  <text x="400" y="48" text-anchor="middle" font-size="11.5" fill="#475569">Every launch console keeps mandatory RTGI and 600,000+ world animations inside a 33.3 ms (30 FPS) frame budget</text>

  <!-- Tier 1: PS5 Pro -->
  <rect x="24" y="66" width="242" height="186" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
  <rect x="38" y="80" width="86" height="22" rx="5" fill="#047857"/>
  <text x="81" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">PS5 PRO</text>
  <text x="252" y="95" text-anchor="end" font-size="10.5" font-weight="700" fill="#065f46">Smoothest tier</text>

  <text x="38" y="122" font-size="11.5" font-weight="700" fill="#0f172a">1440p -&gt; 4K (AI PSSR)</text>
  <text x="38" y="140" font-size="10.5" fill="#334155">Sharpest reconstruction</text>
  <line x1="38" y1="152" x2="252" y2="152" stroke="#a7f3d0"/>
  <text x="38" y="170" font-size="11" font-weight="700" fill="#065f46">Lighting stack</text>
  <text x="38" y="186" font-size="10.5" fill="#334155">RTGI + RT reflections</text>
  <text x="38" y="201" font-size="10.5" font-weight="600" fill="#047857">+ Exclusive RT shadows</text>
  <line x1="38" y1="212" x2="252" y2="212" stroke="#a7f3d0"/>
  <text x="38" y="230" font-size="11" font-weight="700" fill="#0f172a">Near-locked 30 FPS</text>
  <text x="38" y="244" font-size="10" fill="#475569">Rare dips (~24 FPS in chaos)</text>

  <!-- Tier 2: Base PS5 & Series X -->
  <rect x="279" y="66" width="242" height="186" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <rect x="293" y="80" width="132" height="22" rx="5" fill="#1d4ed8"/>
  <text x="359" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">PS5 &amp; SERIES X</text>
  <text x="507" y="95" text-anchor="end" font-size="10.5" font-weight="700" fill="#1e40af">Core baseline</text>

  <text x="293" y="122" font-size="11.5" font-weight="700" fill="#0f172a">1440p -&gt; 4K (spatial + TAA)</text>
  <text x="293" y="140" font-size="10.5" fill="#334155">Softer image than PSSR</text>
  <line x1="293" y1="152" x2="507" y2="152" stroke="#bfdbfe"/>
  <text x="293" y="170" font-size="11" font-weight="700" fill="#1e40af">Lighting stack</text>
  <text x="293" y="186" font-size="10.5" fill="#334155">RTGI + RT reflections</text>
  <text x="293" y="201" font-size="10.5" fill="#475569">Standard shadow maps</text>
  <line x1="293" y1="212" x2="507" y2="212" stroke="#bfdbfe"/>
  <text x="293" y="230" font-size="11" font-weight="700" fill="#0f172a">30 FPS target</text>
  <text x="293" y="244" font-size="10" fill="#475569">High-20s dips in heavy scenes</text>

  <!-- Tier 3: Xbox Series S -->
  <rect x="534" y="66" width="242" height="186" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <rect x="548" y="80" width="112" height="22" rx="5" fill="#c2410c"/>
  <text x="604" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">XBOX SERIES S</text>
  <text x="762" y="95" text-anchor="end" font-size="10.5" font-weight="700" fill="#9a3412">Budget floor</text>

  <text x="548" y="122" font-size="11.5" font-weight="700" fill="#0f172a">720p -&gt; 1080p (AMD FSR 4)</text>
  <text x="548" y="140" font-size="10.5" fill="#9a3412">First Xbox game with FSR 4</text>
  <line x1="548" y1="152" x2="762" y2="152" stroke="#fed7aa"/>
  <text x="548" y="170" font-size="11" font-weight="700" fill="#9a3412">Lighting stack</text>
  <text x="548" y="186" font-size="10.5" fill="#334155">Keeps RTGI &amp; crowd parity</text>
  <text x="548" y="201" font-size="10.5" fill="#475569">Lower-res reflections &amp; clouds</text>
  <line x1="548" y1="212" x2="762" y2="212" stroke="#fed7aa"/>
  <text x="548" y="230" font-size="11" font-weight="700" fill="#0f172a">Mid-to-high 20s FPS</text>
  <text x="548" y="244" font-size="10" fill="#475569">Strains hardest under chaos</text>

  <!-- Bottom takeaway strip -->
  <rect x="24" y="266" width="752" height="54" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="400" y="288" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Why no 60 FPS mode? 30 FPS gives 33.3 ms per frame instead of 16.7 ms</text>
  <text x="400" y="307" text-anchor="middle" font-size="11" fill="#475569">Rockstar spent that entire CPU and GPU budget on world density, real-time water/wind physics, and mandatory ray tracing.</text>
</svg>
