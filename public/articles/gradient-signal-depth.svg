<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="Comparison of backward learning signal attenuation across 4 hidden layers. On the top track, four sigmoid activations with slope 0.1 reduce a 1.0000 signal down to 0.0001. On the bottom track, four active ReLU units with slope 1.0 preserve the full 1.0000 signal across all layers.">
  <title>Why slopes multiply across depth in sigmoid vs. ReLU networks</title>

  <rect x="0.5" y="0.5" width="799" height="359" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />

  <!-- Header -->
  <text x="400" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700" fill="#0f172a">How local slopes compound across 4 hidden layers (backward pass)</text>
  <text x="400" y="50" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">During training, the learning signal flows right to left and multiplies by each layer's local activation slope</text>

  <!-- Direction indicator pill -->
  <rect x="276" y="64" width="248" height="22" rx="11" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <text x="400" y="79" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#334155">← Learning signal flows backward from loss ←</text>

  <!-- TRACK 1: SIGMOID -->
  <rect x="24" y="98" width="752" height="114" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2" />
  <text x="40" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#9a3412">Sigmoid layers in tail (slope = 0.1 per layer)</text>
  <text x="760" y="120" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#b45309">Even steepest peak (0.25^4) = 0.0039</text>

  <!-- Start signal (right) -> Layer 4 -> Layer 3 -> Layer 2 -> Layer 1 -> Left result -->
  <!-- Right badge: 1.0000 -->
  <rect x="688" y="138" width="72" height="34" rx="6" fill="#ffffff" stroke="#fb923c" stroke-width="1.5" />
  <text x="724" y="159" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#9a3412">1.0000</text>

  <!-- Arrow 1 (start -> L4) -->
  <line x1="686" y1="155" x2="646" y2="155" stroke="#ea580c" stroke-width="4" />
  <polygon points="646,149 635,155 646,161" fill="#ea580c" />

  <!-- Box L4 -->
  <rect x="556" y="138" width="78" height="34" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3" />
  <text x="595" y="153" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#7c2d12">Layer 4</text>
  <text x="595" y="166" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#9a3412">× 0.1</text>

  <!-- Arrow 2 (L4 -> L3) -->
  <line x1="554" y1="155" x2="514" y2="155" stroke="#ea580c" stroke-width="2.8" />
  <polygon points="514,150 505,155 514,160" fill="#ea580c" />
  <text x="530" y="189" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#9a3412">0.1000</text>

  <!-- Box L3 -->
  <rect x="424" y="138" width="78" height="34" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3" />
  <text x="463" y="153" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#7c2d12">Layer 3</text>
  <text x="463" y="166" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#9a3412">× 0.1</text>

  <!-- Arrow 3 (L3 -> L2) -->
  <line x1="422" y1="155" x2="382" y2="155" stroke="#ea580c" stroke-width="2" />
  <polygon points="382,151 374,155 382,159" fill="#ea580c" />
  <text x="398" y="189" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#9a3412">0.0100</text>

  <!-- Box L2 -->
  <rect x="292" y="138" width="78" height="34" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3" />
  <text x="331" y="153" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#7c2d12">Layer 2</text>
  <text x="331" y="166" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#9a3412">× 0.1</text>

  <!-- Arrow 4 (L2 -> L1) -->
  <line x1="290" y1="155" x2="250" y2="155" stroke="#ea580c" stroke-width="1.4" />
  <polygon points="250,152 243,155 250,158" fill="#ea580c" />
  <text x="266" y="189" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#9a3412">0.0010</text>

  <!-- Box L1 -->
  <rect x="160" y="138" width="78" height="34" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3" />
  <text x="199" y="153" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#7c2d12">Layer 1</text>
  <text x="199" y="166" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#9a3412">× 0.1</text>

  <!-- Arrow 5 (L1 -> Final) -->
  <line x1="158" y1="155" x2="122" y2="155" stroke="#dc2626" stroke-width="1" stroke-dasharray="3 2" />
  <polygon points="122,152 115,155 122,158" fill="#dc2626" />

  <!-- Final left result -->
  <rect x="40" y="136" width="74" height="38" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6" />
  <text x="77" y="153" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#b91c1c">0.0001</text>
  <text x="77" y="167" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#991b1b">0.01% left</text>

  <!-- TRACK 2: RELU -->
  <rect x="24" y="224" width="752" height="114" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2" />
  <text x="40" y="246" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">Active ReLU layers (z &gt; 0, slope = 1.0 per layer)</text>
  <text x="760" y="246" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#1d4ed8">Signal crosses positive paths without shrinking</text>

  <!-- Right badge: 1.0000 -->
  <rect x="688" y="264" width="72" height="34" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="724" y="285" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#1e3a8a">1.0000</text>

  <!-- Arrow 1 -->
  <line x1="686" y1="281" x2="646" y2="281" stroke="#2563eb" stroke-width="4" />
  <polygon points="646,275 635,281 646,287" fill="#2563eb" />

  <!-- Box L4 -->
  <rect x="556" y="264" width="78" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3" />
  <text x="595" y="279" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">ReLU 4</text>
  <text x="595" y="292" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#1d4ed8">× 1.0</text>

  <!-- Arrow 2 -->
  <line x1="554" y1="281" x2="514" y2="281" stroke="#2563eb" stroke-width="4" />
  <polygon points="514,275 503,281 514,287" fill="#2563eb" />
  <text x="530" y="315" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#1d4ed8">1.0000</text>

  <!-- Box L3 -->
  <rect x="424" y="264" width="78" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3" />
  <text x="463" y="279" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">ReLU 3</text>
  <text x="463" y="292" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#1d4ed8">× 1.0</text>

  <!-- Arrow 3 -->
  <line x1="422" y1="281" x2="382" y2="281" stroke="#2563eb" stroke-width="4" />
  <polygon points="382,275 371,281 382,287" fill="#2563eb" />
  <text x="398" y="315" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#1d4ed8">1.0000</text>

  <!-- Box L2 -->
  <rect x="292" y="264" width="78" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3" />
  <text x="331" y="279" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">ReLU 2</text>
  <text x="331" y="292" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#1d4ed8">× 1.0</text>

  <!-- Arrow 4 -->
  <line x1="290" y1="281" x2="250" y2="281" stroke="#2563eb" stroke-width="4" />
  <polygon points="250,275 239,281 250,287" fill="#2563eb" />
  <text x="266" y="315" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#1d4ed8">1.0000</text>

  <!-- Box L1 -->
  <rect x="160" y="264" width="78" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3" />
  <text x="199" y="279" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">ReLU 1</text>
  <text x="199" y="292" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#1d4ed8">× 1.0</text>

  <!-- Arrow 5 -->
  <line x1="158" y1="281" x2="122" y2="281" stroke="#059669" stroke-width="4" />
  <polygon points="122,275 111,281 122,287" fill="#059669" />

  <!-- Final left result -->
  <rect x="40" y="262" width="74" height="38" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.6" />
  <text x="77" y="279" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#065f46">1.0000</text>
  <text x="77" y="293" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#047857">100% left</text>
</svg>
