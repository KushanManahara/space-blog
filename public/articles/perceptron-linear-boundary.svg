<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 385" width="800" height="385" role="img" aria-label="Two 2D coordinate planes showing perceptron decision boundaries. Left panel demonstrates that changing the bias shifts the straight line x1 + x2 + b = 0 parallel from b = -0.5 to b = -1.5, while changing weight ratio rotates the line to 2*x1 + x2 - 1.5 = 0. Right panel shows logical OR (x1 + x2 - 0.5 = 0) separating (0,0) from the three positive corners and logical AND (x1 + x2 - 1.5 = 0) isolating (1,1).">
  <title>How perceptron weights rotate and biases slide a straight boundary</title>

  <rect x="0.5" y="0.5" width="799" height="384" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />

  <!-- Panel headings -->
  <text x="200" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">Weights rotate, bias slides</text>
  <text x="200" y="47" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">x2 = -(w1/w2)x1 - b/w2 in 2D input space</text>

  <text x="600" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">Linearly separable gates: OR and AND</text>
  <text x="600" y="47" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Shifting bias from -0.5 to -1.5 switches OR to AND</text>

  <line x1="400" y1="20" x2="400" y2="330" stroke="#e2e8f0" stroke-width="1" />

  <!-- LEFT PANEL box -->
  <rect x="80" y="72" width="240" height="238" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <polygon points="80,250 80,72 320,72 320,310 140,310" fill="#0284c7" fill-opacity="0.08" />

  <!-- Axes -->
  <line x1="140" y1="72" x2="140" y2="310" stroke="#cbd5e1" stroke-width="1.2" />
  <line x1="80" y1="250" x2="320" y2="250" stroke="#cbd5e1" stroke-width="1.2" />
  <text x="328" y="254" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#475569">x1</text>
  <text x="140" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#475569">x2</text>

  <!-- Line 1 (b = -0.5) -->
  <line x1="80" y1="130" x2="260" y2="310" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" />
  <rect x="84" y="182" width="58" height="16" rx="3" fill="#f8fafc" fill-opacity="0.92" />
  <text x="113" y="194" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#475569">b = -0.5</text>

  <!-- Line 2 (b = -1.5) -->
  <line x1="140" y1="72" x2="320" y2="250" stroke="#0284c7" stroke-width="2.5" />
  <text x="256" y="138" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700" fill="#0369a1">b = -1.5</text>

  <!-- Bias slide arrow between b=-0.5 and b=-1.5 -->
  <line x1="170" y1="220" x2="225" y2="165" stroke="#0284c7" stroke-width="2" />
  <polygon points="220,162 230,160 227,170" fill="#0284c7" />
  <rect x="144" y="166" width="66" height="15" rx="3" fill="#eff6ff" fill-opacity="0.95" />
  <text x="177" y="177" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#0369a1">bias slides</text>

  <!-- Rotated Line 3: 2*x1 + x2 - 1.5 = 0 -->
  <line x1="140" y1="72" x2="260" y2="310" stroke="#d97706" stroke-width="2.3" />
  <rect x="195" y="284" width="110" height="16" rx="3" fill="#f8fafc" fill-opacity="0.92" />
  <text x="250" y="296" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#b45309">w = (2,1) rotates</text>

  <!-- Origin marker -->
  <circle cx="140" cy="250" r="3.5" fill="#475569" />
  <text x="120" y="268" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" fill="#475569">(0,0)</text>

  <!-- RIGHT PANEL box -->
  <rect x="480" y="72" width="240" height="238" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <polygon points="480,130 480,72 720,72 720,310 660,310" fill="#0284c7" fill-opacity="0.09" />
  <polygon points="540,72 720,72 720,250" fill="#10b981" fill-opacity="0.16" />

  <!-- Axes -->
  <line x1="540" y1="72" x2="540" y2="310" stroke="#cbd5e1" stroke-width="1.2" />
  <line x1="480" y1="250" x2="720" y2="250" stroke="#cbd5e1" stroke-width="1.2" />
  <text x="728" y="254" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#475569">x1</text>
  <text x="540" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#475569">x2</text>

  <!-- OR cut line -->
  <line x1="480" y1="130" x2="660" y2="310" stroke="#0284c7" stroke-width="2.2" />
  <text x="586" y="206" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0369a1">OR cut</text>

  <!-- AND cut line -->
  <line x1="540" y1="72" x2="720" y2="250" stroke="#059669" stroke-width="2.2" />
  <text x="646" y="106" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#047857">AND cut</text>

  <!-- 4 binary corners -->
  <circle cx="540" cy="250" r="7" fill="#ffffff" stroke="#d97706" stroke-width="2.8" />
  <text x="515" y="268" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" fill="#475569">(0,0)</text>

  <circle cx="540" cy="130" r="7" fill="#0284c7" />
  <text x="515" y="124" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" fill="#475569">(0,1)</text>

  <circle cx="660" cy="250" r="7" fill="#0284c7" />
  <text x="677" y="268" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" fill="#475569">(1,0)</text>

  <circle cx="660" cy="130" r="8" fill="#059669" stroke="#ffffff" stroke-width="2" />
  <text x="687" y="128" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#065f46">(1,1)</text>

  <!-- Bottom Legend -->
  <text x="400" y="362" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#334155">One neuron cleanly isolates (0,0) for OR and (1,1) for AND with a single straight line because both rules are linearly separable.</text>
</svg>
