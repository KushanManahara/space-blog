<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-label="Two-panel illustration of Leaky ReLU and its negative slope parameter alpha. Left panel plots z from -6 to +4 comparing ReLU (alpha = 0), default Leaky ReLU (alpha = 0.01 reaching -0.05 at z = -5), exaggerated Leaky ReLU (alpha = 0.1 for visual clarity), and the linear extreme (alpha = 1.0 forming a straight line with no bend). Right panel summarizes why alpha too tiny stalls like ReLU, alpha = 0.01 rescues dead units cleanly, and alpha near 1 collapses nonlinearity.">
  <title>Leaky ReLU negative slope comparison and alpha trade-off</title>

  <rect x="0.5" y="0.5" width="799" height="329" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />

  <!-- Header -->
  <text x="400" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Leaky ReLU tilts negative inputs by α so dead units keep learning</text>
  <text x="400" y="47" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Replacing ReLU's flat 0 floor with α·z keeps a backward gradient, governed by the size of α</text>

  <line x1="414" y1="62" x2="414" y2="288" stroke="#e2e8f0" stroke-width="1" />

  <!-- LEFT PANEL: px(z) = 248 + 28z ([-6..+4] -> 80..360), py(y) = 198 - 22y ([y in -3..+4] -> 264..110) -->
  <text x="210" y="75" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Varying negative slope α</text>
  <rect x="24" y="86" width="372" height="196" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />

  <!-- Subtle z < 0 region -->
  <rect x="74" y="100" width="174" height="162" fill="#f1f5f9" fill-opacity="0.7" />

  <!-- Axes -->
  <line x1="74" y1="198" x2="372" y2="198" stroke="#94a3b8" stroke-width="1.2" />
  <line x1="248" y1="100" x2="248" y2="254" stroke="#94a3b8" stroke-width="1.2" />

  <text x="66" y="202" text-anchor="end" font-family="ui-monospace, monospace" font-size="10" fill="#475569">0</text>
  <text x="66" y="158" text-anchor="end" font-family="ui-monospace, monospace" font-size="10" fill="#475569">+2</text>
  <text x="66" y="114" text-anchor="end" font-family="ui-monospace, monospace" font-size="10" fill="#475569">+4</text>
  <text x="66" y="246" text-anchor="end" font-family="ui-monospace, monospace" font-size="10" fill="#475569">-2</text>

  <text x="108" y="268" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">-5</text>
  <text x="192" y="268" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">-2</text>
  <text x="248" y="268" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#0f172a">0</text>
  <text x="304" y="268" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">+2</text>
  <text x="360" y="268" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">+4</text>

  <!-- alpha = 1.0 dotted red straight line (-2.5, -2.5) to (0, 0): (178, 253) to (248, 198) -->
  <line x1="178" y1="253" x2="248" y2="198" stroke="#dc2626" stroke-width="2" stroke-dasharray="3 3" />
  <text x="172" y="247" text-anchor="end" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#b91c1c">α=1.0 (linear!)</text>

  <!-- ReLU dashed baseline (z=-6..0 at y=0: (80, 198)..(248, 198)) -->
  <line x1="80" y1="198" x2="248" y2="198" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="4 3" />

  <!-- alpha = 0.01 default green: at z=-6, y=-0.06 => py=199.3 -->
  <line x1="80" y1="199.3" x2="248" y2="198" stroke="#059669" stroke-width="2.4" />
  <circle cx="108" cy="199.1" r="3.8" fill="#059669" stroke="#ffffff" stroke-width="1.4" />
  <text x="148" y="178" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#047857">α=0.01: (-5, -0.05)</text>
  <line x1="118" y1="183" x2="110" y2="194" stroke="#059669" stroke-width="1" stroke-dasharray="2 2" />

  <!-- alpha = 0.1 exaggerated blue for visual clarity: at z=-6, y=-0.6 => py=211.2; at z=-5, y=-0.5 => py=209 -->
  <line x1="80" y1="211.2" x2="248" y2="198" stroke="#2563eb" stroke-width="2.6" />
  <text x="108" y="226" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#1d4ed8">α=0.1 (visible)</text>

  <!-- Shared positive y = z branch from (0,0) to (+4, +4) -->
  <line x1="248" y1="198" x2="360" y2="110" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />
  <circle cx="248" cy="198" r="4.5" fill="#0284c7" stroke="#ffffff" stroke-width="1.5" />
  <text x="256" y="126" text-anchor="start" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#0369a1">z &gt; 0: y = z</text>

  <!-- RIGHT PANEL: Trade-off spectrum -->
  <text x="598" y="75" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">How α trades gradient vs. bend</text>
  <rect x="430" y="86" width="346" height="196" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />

  <rect x="444" y="100" width="318" height="48" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1" />
  <text x="456" y="119" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#b45309">α too tiny (e.g. 0.0001)</text>
  <text x="456" y="137" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#92400e">Recovery gradient ~ 0, nearly dead like plain ReLU.</text>

  <rect x="444" y="159" width="318" height="54" rx="6" fill="#ecfdf5" stroke="#86efac" stroke-width="1.3" />
  <text x="456" y="178" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#047857">PyTorch default α = 0.01</text>
  <rect x="652" y="164" width="98" height="18" rx="9" fill="#059669" />
  <text x="701" y="176" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#ffffff">Balanced</text>
  <text x="456" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#065f46">Strong bend plus 0.01 slope keeps stuck units alive.</text>

  <rect x="444" y="224" width="318" height="46" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" />
  <text x="456" y="242" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#b91c1c">α too large (toward 1.0)</text>
  <text x="456" y="259" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#991b1b">Bend vanishes toward f(z) = z, turning layers linear.</text>

  <!-- Footer -->
  <text x="400" y="310" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#334155">Larger charts often draw α = 0.1 so the tilt is visible; PyTorch's nn.LeakyReLU defaults to 0.01.</text>
</svg>
