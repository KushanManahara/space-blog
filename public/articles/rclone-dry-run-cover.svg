<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="A terminal reporting Transferred 100% above an empty destination bar reading 0 B">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F1A" />
      <stop offset="55%" stop-color="#0D1422" />
      <stop offset="100%" stop-color="#0F1A2E" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="44%" r="46%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="fill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#02060E" flood-opacity="0.55" />
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)" />
  <rect width="1200" height="800" fill="url(#glow)" />

  <!-- terminal card, kept inside the central square so it survives any object-cover crop -->
  <g filter="url(#cardShadow)">
    <rect x="220" y="190" width="760" height="420" rx="20" fill="#121A2B" stroke="#FFFFFF" stroke-opacity="0.09" />
  </g>
  <path d="M220 232 H980" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1" />
  <circle cx="256" cy="211" r="5.5" fill="#E5695E" />
  <circle cx="278" cy="211" r="5.5" fill="#E0B44A" />
  <circle cx="300" cy="211" r="5.5" fill="#4FB06A" />

  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
    <!-- the command -->
    <text x="268" y="284" font-size="19" fill="#8D9DB8">
      <tspan fill="#4E5D77">$ </tspan><tspan fill="#C3D0E3">rclone copy </tspan><tspan fill="#8D9DB8">onedrive:Photos gdrive:Backup </tspan><tspan fill="#F5A524" font-weight="700">--dry-run</tspan>
    </text>

    <!-- what it reported -->
    <text x="268" y="336" font-size="13" letter-spacing="2.4" fill="#5D6B85">REPORTED</text>
    <rect x="268" y="350" width="664" height="16" rx="8" fill="#1A2436" />
    <rect x="268" y="350" width="664" height="16" rx="8" fill="url(#fill)" />
    <text x="268" y="400" font-size="20" fill="#E6EEF9">9.406 GiB / 9.406 GiB, <tspan font-weight="700">100%</tspan></text>

    <!-- what actually landed -->
    <text x="268" y="452" font-size="13" letter-spacing="2.4" fill="#5D6B85">ACTUALLY WRITTEN</text>
    <rect x="268" y="466" width="664" height="16" rx="8" fill="none" stroke="#2C3852" stroke-width="1.5" stroke-dasharray="7 7" />
    <text x="268" y="516" font-size="20" fill="#F5A524">0 B <tspan fill="#5D6B85">·</tspan> 0 of 1,934 files</text>

    <text x="268" y="570" font-size="16" fill="#55627C">Skipped copy as --dry-run is set <tspan fill="#3E4A61">× 1,934</tspan></text>
  </g>
</svg>
