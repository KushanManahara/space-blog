<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" role="img" aria-label="Worked four-class support ticket cross-entropy example on logits [billing: 1.2, login: 3.7, bug: 0.4, feature: -0.8]. Top path shows Softmax normalizing probabilities to [0.073, 0.885, 0.033, 0.010] and NLL taking -ln(0.885) = 0.122 on true class login. Bottom shows fused LogSoftmax computation z_k - ln(sum e^z) = 3.7 - 3.822 = -0.122 and contrasts it with the double-softmax bug that raises loss falsely to 0.827.">
  <title>Multiclass CrossEntropyLoss on support-ticket logits: LogSoftmax plus NLLLoss</title>

  <rect x="0.5" y="0.5" width="799" height="349" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />

  <!-- Header -->
  <text x="400" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Support-ticket cross-entropy: Softmax vs. fused LogSoftmax + NLLLoss</text>
  <text x="400" y="47" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Raw logits [1.2, 3.7, 0.4, -0.8] with correct category = login (index 1)</text>

  <!-- TOP TABLE: 4 classes flow -->
  <rect x="28" y="66" width="744" height="162" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />

  <!-- Column headers -->
  <text x="52" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#475569">Class</text>
  <text x="150" y="90" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#475569">Raw logit z_k</text>
  <text x="275" y="90" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#475569">Softmax p_k</text>
  <text x="445" y="90" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#475569">Probability share</text>
  <text x="645" y="90" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#065f46">LogSoftmax ln(p_k) = z_k - 3.822</text>

  <!-- Row 0: billing -->
  <text x="52" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">billing (0)</text>
  <text x="150" y="118" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" fill="#334155">1.2</text>
  <text x="275" y="118" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" fill="#334155">0.073</text>
  <rect x="355" y="107" width="180" height="14" rx="4" fill="#e2e8f0" />
  <rect x="355" y="107" width="13.1" height="14" rx="3" fill="#64748b" />
  <text x="645" y="118" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" fill="#64748b">-2.622  (ignored by NLL)</text>

  <!-- Row 1: login (CORRECT) -->
  <rect x="38" y="129" width="724" height="30" rx="6" fill="#ecfdf5" stroke="#34d399" stroke-width="1.3" />
  <text x="52" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#065f46">login (1) ✓</text>
  <text x="150" y="148" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#065f46">3.7</text>
  <text x="275" y="148" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#065f46">0.885</text>
  <rect x="355" y="137" width="180" height="14" rx="4" fill="#d1fae5" />
  <rect x="355" y="137" width="159.3" height="14" rx="3" fill="#059669" />
  <text x="645" y="148" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#065f46">-0.122 → NLL = +0.122</text>

  <!-- Row 2: bug -->
  <text x="52" y="179" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">bug (2)</text>
  <text x="150" y="179" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" fill="#334155">0.4</text>
  <text x="275" y="179" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" fill="#334155">0.033</text>
  <rect x="355" y="168" width="180" height="14" rx="4" fill="#e2e8f0" />
  <rect x="355" y="168" width="6.0" height="14" rx="2" fill="#94a3b8" />
  <text x="645" y="179" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" fill="#64748b">-3.422  (ignored by NLL)</text>

  <!-- Row 3: feature -->
  <text x="52" y="209" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">feature (3)</text>
  <text x="150" y="209" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" fill="#334155">-0.8</text>
  <text x="275" y="209" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" fill="#334155">0.010</text>
  <rect x="355" y="198" width="180" height="14" rx="4" fill="#e2e8f0" />
  <rect x="355" y="198" width="3.0" height="14" rx="1.5" fill="#94a3b8" />
  <text x="645" y="209" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" fill="#64748b">-4.622  (ignored by NLL)</text>

  <!-- BOTTOM COMPARISON: Safe vs Double-Softmax -->
  <rect x="28" y="242" width="364" height="62" rx="8" fill="#ecfdf5" stroke="#86efac" stroke-width="1.2" />
  <text x="44" y="264" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#065f46">Correct: CrossEntropyLoss(logits, target)</text>
  <text x="44" y="284" font-family="ui-monospace, monospace" font-size="11" fill="#047857">p_login = 0.885  →  loss = -ln(0.885) = 0.122</text>

  <rect x="408" y="242" width="364" height="62" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2" />
  <text x="424" y="264" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#991b1b">Double-softmax trap: CrossEntropyLoss(probs)</text>
  <text x="424" y="284" font-family="ui-monospace, monospace" font-size="11" fill="#b91c1c">Squashed p = 0.437  →  wrong loss = 0.827</text>

  <!-- Footer -->
  <text x="400" y="330" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#334155">Pass raw logits directly: CrossEntropyLoss computes stable LogSoftmax + NLLLoss inside one fused kernel.</text>
</svg>
