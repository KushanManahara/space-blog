<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 315" width="800" height="315" role="img" aria-label="Two-panel comparison of naive log-sum-exp versus the max-shift stabilization trick for logits 1000, 999, and 998. Left panel shows exp(1000) overflowing 32-bit float to infinity and producing NaN. Right panel shifts every logit by subtracting the maximum 1000, plotting safe exponential bars 1.000, 0.368, and 0.135 whose sum is 1.503, yielding exact answer 1000.408.">
  <title>How subtracting max(z) stabilizes log-sum-exp without changing the result</title>

  <rect x="0.5" y="0.5" width="799" height="314" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />

  <!-- Header -->
  <text x="400" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0f172a">The log-sum-exp trick: factoring out eᵐ prevents infinity</text>
  <text x="400" y="47" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Test logits z = [1000, 999, 998]: direct exponentiation explodes, while shifting by m = 1000 keeps every exponent &lt;= 1</text>

  <line x1="376" y1="62" x2="376" y2="280" stroke="#e2e8f0" stroke-width="1" />

  <!-- LEFT PANEL: Naive overflow -->
  <text x="196" y="75" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#991b1b">Naive: ln(e¹⁰⁰⁰ + e⁹⁹⁹ + e⁹⁹⁸)</text>
  <rect x="24" y="86" width="332" height="190" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1" />

  <rect x="42" y="102" width="296" height="32" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1" />
  <text x="190" y="122" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#0f172a">Raw logits: [1000, 999, 998]</text>

  <line x1="190" y1="138" x2="190" y2="156" stroke="#dc2626" stroke-width="1.5" />
  <polygon points="186,155 190,163 194,155" fill="#dc2626" />

  <rect x="42" y="165" width="296" height="44" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.2" />
  <text x="190" y="184" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#b91c1c">float32 max ≈ 3.4 × 10³⁸</text>
  <text x="190" y="201" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" fill="#7f1d1d">exp(1000) overflows -&gt; inf</text>

  <line x1="190" y1="213" x2="190" y2="230" stroke="#dc2626" stroke-width="1.5" />
  <polygon points="186,229 190,237 194,229" fill="#dc2626" />

  <rect x="42" y="238" width="296" height="26" rx="6" fill="#dc2626" />
  <text x="190" y="255" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#ffffff">softmax -&gt; inf / inf = NaN crash</text>

  <!-- RIGHT PANEL: Max-shift trick -->
  <text x="586" y="75" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#065f46">Safe: m + ln(e⁰ + e⁻¹ + e⁻²)</text>
  <rect x="394" y="86" width="382" height="190" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1" />

  <text x="412" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#065f46">Subtract max logit m = 1000 -&gt; shifted [0, -1, -2]</text>

  <!-- Shifted bars: width scale 190 px for value 1.000 -->
  <text x="412" y="133" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#334155">e^(1000−1000) = e⁰</text>
  <rect x="546" y="121" width="160" height="16" rx="4" fill="#059669" />
  <text x="714" y="133" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#065f46">1.000</text>

  <text x="412" y="160" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#334155">e^(999−1000) = e⁻¹</text>
  <rect x="546" y="148" width="58.9" height="16" rx="4" fill="#0d9488" />
  <text x="614" y="160" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#0f766e">0.368</text>

  <text x="412" y="187" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#334155">e^(998−1000) = e⁻²</text>
  <rect x="546" y="175" width="21.6" height="16" rx="4" fill="#14b8a6" />
  <text x="576" y="187" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#0f766e">0.135</text>

  <!-- Calculation strip -->
  <rect x="412" y="206" width="346" height="56" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1" />
  <text x="585" y="226" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#0f172a">sum = 1.503  -&gt;  ln(1.503) = 0.408</text>
  <text x="585" y="246" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#047857">Exact LSE = 1000 + 0.408 = 1000.408</text>

  <!-- Footer -->
  <text x="400" y="299" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#334155">Every shifted term sits inside (0, 1], giving identical exact mathematics without overflowing floating point.</text>
</svg>
