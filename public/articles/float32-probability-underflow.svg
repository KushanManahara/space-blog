<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 315" width="800" height="315" role="img" aria-label="Two-panel visual explaining why multiplying independent probabilities causes float32 underflow. Left panel shows two fair coins multiplying (0.5 times 0.5 equals 0.25) and three support tickets multiplying (0.90 times 0.80 times 0.95 equals 0.684). Right panel traces 0.9 to the power N across 1, 10, 100, and 1,000 tickets, crossing below the 32-bit float minimum (1.4 times 10 to the -45) at 1.75 times 10 to the -46 and snapping silently to 0.0.">
  <title>Why multiplying probabilities shrinks below 32-bit floating-point storage</title>

  <rect x="0.5" y="0.5" width="799" height="314" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />

  <!-- Header -->
  <text x="400" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Independent chances multiply, until 32-bit memory rounds them to zero</text>
  <text x="400" y="47" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Every probability sits below 1, so multiplying hundreds of examples together shrinks toward float32 underflow</text>

  <line x1="376" y1="62" x2="376" y2="278" stroke="#e2e8f0" stroke-width="1" />

  <!-- LEFT PANEL: Coins & 3-ticket likelihood -->
  <text x="196" y="75" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">1. Independent probabilities multiply</text>
  <rect x="24" y="86" width="332" height="188" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />

  <!-- Fair coins box -->
  <rect x="40" y="100" width="300" height="68" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" />
  <text x="52" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">Two fair coins (both heads):</text>
  <circle cx="76" cy="144" r="14" fill="#ffffff" stroke="#3b82f6" stroke-width="1.4" />
  <text x="76" y="148" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#1d4ed8">0.5</text>
  <text x="104" y="148" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#64748b">×</text>
  <circle cx="132" cy="144" r="14" fill="#ffffff" stroke="#3b82f6" stroke-width="1.4" />
  <text x="132" y="148" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#1d4ed8">0.5</text>
  <text x="160" y="148" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#64748b">=</text>
  <rect x="176" y="130" width="146" height="28" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.1" />
  <text x="249" y="148" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#1e3a8a">0.25 (1 in 4)</text>

  <!-- Three tickets box -->
  <rect x="40" y="180" width="300" height="80" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1" />
  <text x="52" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#065f46">Three tickets (joint likelihood):</text>
  <text x="190" y="220" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#047857">0.90 × 0.80 × 0.95 = 0.684</text>
  <text x="190" y="244" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#065f46">Training wants this joint likelihood as high as possible.</text>

  <!-- RIGHT PANEL: Underflow ladder for 0.9^N -->
  <text x="586" y="75" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#991b1b">2. Multiplying 0.9 across N tickets</text>
  <rect x="394" y="86" width="382" height="188" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />

  <!-- Bar rows -->
  <text x="410" y="114" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#334155">N = 1</text>
  <rect x="492" y="102" width="162" height="15" rx="4" fill="#0284c7" />
  <text x="664" y="114" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#0369a1">0.900</text>

  <text x="410" y="140" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#334155">N = 10</text>
  <rect x="492" y="128" width="63" height="15" rx="4" fill="#0ea5e9" />
  <text x="564" y="140" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#0369a1">0.349</text>

  <text x="410" y="166" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#334155">N = 100</text>
  <rect x="492" y="154" width="6" height="15" rx="2" fill="#d97706" />
  <text x="508" y="166" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#b45309">0.0000266 (2.7×10⁻⁵)</text>

  <!-- Float32 floor box -->
  <rect x="408" y="182" width="354" height="32" rx="5" fill="#fffbeb" stroke="#fcd34d" stroke-width="1" />
  <text x="585" y="202" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#92400e">32-bit float smallest positive ≈ 1.4 × 10⁻⁴⁵</text>

  <!-- N = 1000 crash box -->
  <rect x="408" y="222" width="354" height="40" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2" />
  <text x="585" y="239" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#991b1b">N = 1,000: true 1.75 × 10⁻⁴⁶ -&gt; float32 stores 0.0</text>
  <text x="585" y="255" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#7f1d1d">Every large batch underflows to 0.0, erasing the difference between models.</text>

  <!-- Footer -->
  <text x="400" y="298" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#334155">Computers use fixed 32-bit slots, so taking the logarithm avoids underflow by turning multiplication into addition.</text>
</svg>
