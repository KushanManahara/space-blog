<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-label="Two-panel breakdown of the 1,994 parameters and FP32 memory footprint for Linear(20, 64) -> ReLU -> Linear(64, 10). Left panel shows Layer 1 owns 1,344 parameters (1,280 weights plus 64 biases), ReLU owns 0, and Layer 2 owns 650 (640 weights plus 10 biases). Right panel shows how FP32 parameter memory quadruples from 7,976 bytes at inference (4 bytes per parameter) to 31,904 bytes during Adam training (16 bytes per parameter after adding gradients and two Adam optimizer state buffers).">
  <title>Layer parameter ledger and FP32 training memory multiplier</title>

  <rect x="0.5" y="0.5" width="799" height="319" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />

  <!-- Header -->
  <text x="400" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Where the 1,994 parameters live, and why training costs 4× more memory</text>
  <text x="400" y="47" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Layer ledger on Linear(20, 64) → ReLU → Linear(64, 10) vs. float32 storage during Adam training</text>

  <line x1="400" y1="64" x2="400" y2="282" stroke="#e2e8f0" stroke-width="1" />

  <!-- LEFT PANEL: Layer breakdown (total bar width = 280px = 1,994 params) -->
  <rect x="28" y="72" width="352" height="202" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
  <text x="44" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Trainable parameters per layer</text>
  <text x="364" y="96" text-anchor="end" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#0369a1">Total = 1,994</text>

  <!-- Row 1: Linear(20, 64) -> 1,344 (67.4%) -> 188.7px bar, 1280 W (179.7) + 64 b (9.0) -->
  <text x="44" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#0f172a">Linear(20, 64)</text>
  <text x="364" y="126" text-anchor="end" font-family="ui-monospace, monospace" font-size="11" fill="#334155">1,280 W + 64 b = 1,344 (67.4%)</text>
  <rect x="44" y="133" width="320" height="16" rx="4" fill="#e2e8f0" />
  <rect x="44" y="133" width="205.4" height="16" rx="4" fill="#0284c7" />
  <rect x="249.4" y="133" width="10.3" height="16" rx="2" fill="#d97706" />

  <!-- Row 2: ReLU() -> 0 (0%) -->
  <text x="44" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#475569">ReLU()</text>
  <text x="364" y="176" text-anchor="end" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">0 weights + 0 biases = 0 (0%)</text>
  <rect x="44" y="183" width="320" height="16" rx="4" fill="#e2e8f0" />
  <line x1="48" y1="183" x2="48" y2="199" stroke="#64748b" stroke-width="2" />

  <!-- Row 3: Linear(64, 10) -> 650 (32.6%) -> 104.3px total: 640 W (102.7) + 10 b (1.6) -->
  <text x="44" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#0f172a">Linear(64, 10)</text>
  <text x="364" y="226" text-anchor="end" font-family="ui-monospace, monospace" font-size="11" fill="#334155">640 W + 10 b = 650 (32.6%)</text>
  <rect x="44" y="233" width="320" height="16" rx="4" fill="#e2e8f0" />
  <rect x="44" y="233" width="102.7" height="16" rx="4" fill="#0284c7" />
  <rect x="146.7" y="233" width="4" height="16" rx="1" fill="#d97706" />

  <!-- Legend inside left card -->
  <rect x="44" y="258" width="10" height="10" rx="2" fill="#0284c7" />
  <text x="58" y="267" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">Weights (d_out × d_in)</text>
  <rect x="192" y="258" width="10" height="10" rx="2" fill="#d97706" />
  <text x="206" y="267" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">Biases (d_out)</text>

  <!-- RIGHT PANEL: Memory per parameter in FP32 (total bar = 320px = 16 bytes/param) -->
  <rect x="420" y="72" width="352" height="202" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
  <text x="436" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">FP32 memory: inference vs. Adam</text>
  <text x="756" y="96" text-anchor="end" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#065f46">1,994 params</text>

  <!-- Inference row: 4 B/param (80px bar out of 320px = 25%) -->
  <text x="436" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">Inference / checkpoint (4 B/param)</text>
  <rect x="436" y="138" width="320" height="22" rx="5" fill="#e2e8f0" />
  <rect x="436" y="138" width="80" height="22" rx="5" fill="#0284c7" />
  <text x="476" y="153" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#ffffff">Weights</text>
  <text x="528" y="153" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#0369a1">7,976 B (~8 KB)</text>

  <!-- Training row: 16 B/param = 4 B weights (80) + 4 B grads (80) + 8 B Adam m & v (160) -->
  <text x="436" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">Adam training state (16 B/param)</text>
  <rect x="436" y="198" width="80" height="24" rx="4" fill="#0284c7" />
  <text x="476" y="214" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#ffffff">4 B W</text>

  <rect x="518" y="198" width="78" height="24" rx="4" fill="#059669" />
  <text x="557" y="214" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#ffffff">+4 B grad</text>

  <rect x="598" y="198" width="158" height="24" rx="4" fill="#d97706" />
  <text x="677" y="214" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#ffffff">+8 B Adam m &amp; v</text>

  <text x="756" y="242" text-anchor="end" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#9a3412">31,904 B (before activations)</text>

  <text x="436" y="264" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">4 B weights + 4 B grads + 8 B Adam buffers = 16 B/param</text>

  <!-- Footer -->
  <text x="400" y="302" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#334155">Parameters govern stored memory cleanly across every stage: checkpoint weights, gradients, and optimizer momentum buffers.</text>
</svg>
