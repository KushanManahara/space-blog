<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="Geometric mapping from 2D input space (x1, x2) into hidden coordinate space (h1, h2). In input space, positive XOR corners (0,1) and (1,0) sit on opposite diagonals from negative corners (0,0) and (1,1). Passing all four points through hidden units h1 = OR(x) and h2 = AND(x) maps both (0,1) and (1,0) onto the single point (1,0), allowing one straight line h1 - h2 = 0.5 to separate them cleanly.">
  <title>How one hidden layer turns XOR into a linearly separable pattern</title>

  <rect x="0.5" y="0.5" width="799" height="359" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />

  <!-- Header -->
  <text x="400" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0f172a">How a hidden layer warps XOR into a linearly separable space</text>
  <text x="400" y="47" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Hidden neurons move both positive points onto the exact same coordinate (1, 0)</text>

  <!-- Panel Titles cleanly above plot cards -->
  <text x="175" y="74" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Input space (x1, x2)</text>
  <text x="627" y="74" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#065f46">Hidden space (h1, h2)</text>

  <!-- LEFT CARD -->
  <rect x="60" y="84" width="230" height="206" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />

  <!-- Axes -->
  <line x1="110" y1="108" x2="110" y2="262" stroke="#cbd5e1" stroke-width="1.2" />
  <line x1="80" y1="235" x2="268" y2="235" stroke="#cbd5e1" stroke-width="1.2" />
  <text x="275" y="239" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#475569">x1</text>
  <text x="110" y="101" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#475569">x2</text>

  <!-- Diagonals -->
  <line x1="110" y1="130" x2="230" y2="235" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4 3" />
  <line x1="110" y1="235" x2="230" y2="130" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3" />

  <!-- 4 points in input space -->
  <circle cx="110" cy="235" r="7.5" fill="#ffffff" stroke="#d97706" stroke-width="3" />
  <text x="86" y="253" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" fill="#475569">(0,0)</text>

  <circle cx="230" cy="130" r="7.5" fill="#ffffff" stroke="#d97706" stroke-width="3" />
  <text x="255" y="128" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" fill="#475569">(1,1)</text>

  <circle cx="110" cy="130" r="8" fill="#0284c7" />
  <text x="86" y="124" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#0369a1">(0,1)</text>

  <circle cx="230" cy="235" r="8" fill="#0284c7" />
  <text x="252" y="253" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#0369a1">(1,0)</text>

  <text x="175" y="279" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#9a3412">Crossed diagonals: not linearly separable</text>

  <!-- CENTER TRANSFORM ARROW -->
  <rect x="316" y="152" width="168" height="66" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3" />
  <text x="400" y="174" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">Hidden layer transform</text>
  <text x="400" y="192" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#1d4ed8">h1 = step(x1+x2-0.5)</text>
  <text x="400" y="207" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#1d4ed8">h2 = step(x1+x2-1.5)</text>
  <line x1="294" y1="185" x2="314" y2="185" stroke="#2563eb" stroke-width="2.5" />
  <line x1="486" y1="185" x2="504" y2="185" stroke="#2563eb" stroke-width="2.5" />
  <polygon points="502,179 512,185 502,191" fill="#2563eb" />

  <!-- RIGHT CARD -->
  <rect x="512" y="84" width="230" height="206" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" />

  <!-- Shaded positive region -->
  <polygon points="598,262 742,135 742,262" fill="#10b981" fill-opacity="0.16" />

  <!-- Axes -->
  <line x1="562" y1="108" x2="562" y2="262" stroke="#94a3b8" stroke-width="1.2" />
  <line x1="532" y1="235" x2="722" y2="235" stroke="#94a3b8" stroke-width="1.2" />
  <text x="727" y="239" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#475569">h1</text>
  <text x="562" y="101" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#475569">h2</text>

  <!-- Separating line h1 - h2 = 0.5 -->
  <line x1="598" y1="262" x2="742" y2="135" stroke="#059669" stroke-width="2.5" />
  <text x="640" y="182" text-anchor="end" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#047857">h1 - h2 = 0.5</text>

  <!-- 3 mapped points -->
  <circle cx="562" cy="235" r="7.5" fill="#ffffff" stroke="#d97706" stroke-width="3" />
  <text x="542" y="253" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#475569">(0,0)</text>

  <circle cx="682" cy="130" r="7.5" fill="#ffffff" stroke="#d97706" stroke-width="3" />
  <text x="646" y="134" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#475569">(1,1)</text>

  <!-- Collapsed (0,1) & (1,0) at (1,0) -->
  <circle cx="682" cy="235" r="13" fill="none" stroke="#10b981" stroke-width="2" />
  <circle cx="682" cy="235" r="8" fill="#0284c7" />
  <text x="668" y="261" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#0369a1">(0,1) &amp; (1,0) -&gt; (1,0)</text>

  <text x="627" y="279" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#047857">Now ONE output line separates them</text>

  <!-- Footer -->
  <text x="400" y="332" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#334155">Each layer builds a new coordinate representation where hard patterns become simple for the next linear boundary.</text>
</svg>
