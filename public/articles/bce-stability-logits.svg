<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-label="Comparison of naive Sigmoid followed by BCELoss versus fused BCEWithLogitsLoss on urgent ticket y = 1 with extreme wrong logit z = -1000. On top, naive sigmoid(-1000) underflows float32 to 0.0 and BCELoss clamps log(0) at -100, producing broken loss 100 and zero gradient. On bottom, fused softplus(-z) shifts into safe exponentials and computes the exact true loss of 1000.0 while keeping gradient alive.">
  <title>Why BCEWithLogitsLoss preserves gradients and accuracy at extreme logits</title>

  <rect x="0.5" y="0.5" width="799" height="319" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />

  <!-- Header -->
  <text x="400" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Numerical stability on extreme logits: Sigmoid + BCELoss vs. BCEWithLogitsLoss</text>
  <text x="400" y="47" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Urgent ticket (y = 1) where model strongly predicts opposite (logit z = -1000 in float32)</text>

  <!-- TOP TRACK: Unsafe Naive Path -->
  <rect x="28" y="68" width="744" height="96" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.3" />
  <text x="44" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#991b1b">Avoid during training: separate Sigmoid + BCELoss</text>
  <text x="756" y="90" text-anchor="end" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#b91c1c">Breaks on underflow</text>

  <rect x="44" y="106" width="124" height="42" rx="6" fill="#ffffff" stroke="#f87171" stroke-width="1" />
  <text x="106" y="124" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#0f172a">z = -1000</text>
  <text x="106" y="139" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">raw logit</text>

  <line x1="170" y1="127" x2="196" y2="127" stroke="#dc2626" stroke-width="2" />
  <polygon points="196,122 204,127 196,132" fill="#dc2626" />

  <rect x="206" y="106" width="166" height="42" rx="6" fill="#ffffff" stroke="#f87171" stroke-width="1" />
  <text x="289" y="124" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#b91c1c">sigmoid(-1000) → 0.0</text>
  <text x="289" y="139" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#7f1d1d">float32 rounds tiny p to 0</text>

  <line x1="374" y1="127" x2="400" y2="127" stroke="#dc2626" stroke-width="2" />
  <polygon points="400,122 408,127 400,132" fill="#dc2626" />

  <rect x="410" y="106" width="168" height="42" rx="6" fill="#ffffff" stroke="#f87171" stroke-width="1" />
  <text x="494" y="124" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#b91c1c">-ln(0) clamped</text>
  <text x="494" y="139" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#7f1d1d">hits PyTorch -100 floor</text>

  <line x1="580" y1="127" x2="606" y2="127" stroke="#dc2626" stroke-width="2" />
  <polygon points="606,122 614,127 606,132" fill="#dc2626" />

  <rect x="616" y="106" width="140" height="42" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3" />
  <text x="686" y="124" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#991b1b">Loss = 100.0</text>
  <text x="686" y="139" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#b91c1c">gradient = 0 (stuck)</text>

  <!-- BOTTOM TRACK: Fused BCEWithLogitsLoss -->
  <rect x="28" y="178" width="744" height="100" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.3" />
  <text x="44" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#065f46">Standard training contract: pass raw logits to BCEWithLogitsLoss</text>
  <text x="756" y="200" text-anchor="end" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#047857">Exact without overflow</text>

  <rect x="44" y="216" width="124" height="44" rx="6" fill="#ffffff" stroke="#34d399" stroke-width="1" />
  <text x="106" y="234" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#0f172a">z = -1000</text>
  <text x="106" y="249" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">raw logit directly</text>

  <line x1="170" y1="238" x2="196" y2="238" stroke="#059669" stroke-width="2" />
  <polygon points="196,233 204,238 196,243" fill="#059669" />

  <rect x="206" y="216" width="184" height="44" rx="6" fill="#ffffff" stroke="#34d399" stroke-width="1" />
  <text x="298" y="234" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#065f46">softplus(-z) algebra</text>
  <text x="298" y="249" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#047857">max(-z,0) + ln(1+e^-|z|)</text>

  <line x1="392" y1="238" x2="418" y2="238" stroke="#059669" stroke-width="2" />
  <polygon points="418,233 426,238 418,243" fill="#059669" />

  <rect x="428" y="216" width="152" height="44" rx="6" fill="#ffffff" stroke="#34d399" stroke-width="1" />
  <text x="504" y="234" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#065f46">1000 + ln(1 + ~0)</text>
  <text x="504" y="249" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#047857">skips forming exp(+1000)</text>

  <line x1="582" y1="238" x2="606" y2="238" stroke="#059669" stroke-width="2" />
  <polygon points="606,233 614,238 606,243" fill="#059669" />

  <rect x="616" y="216" width="140" height="44" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.3" />
  <text x="686" y="234" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#065f46">Loss = 1000.0</text>
  <text x="686" y="249" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#047857">strong healthy gradient</text>

  <!-- Footer -->
  <text x="400" y="302" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#334155">Pass raw logits during training so PyTorch uses log-space stability, and apply sigmoid separately when displaying probabilities.</text>
</svg>
