name: CI

# `next build` does not run ESLint (Next 16 dropped that), so a lint error can
# sit in the tree indefinitely while every build stays green. This runs the
# gates the build no longer covers, plus the build itself.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

      # The content layer parses every post through its zod schemas at module
      # load, so malformed content fails here rather than in production.
      - run: pnpm build
        env:
          # No database in CI. The build tolerates that — live stats degrade to
          # zero — which keeps real credentials out of the workflow.
          NEXT_PUBLIC_SITE_URL: https://space.gimhara.com
