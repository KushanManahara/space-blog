name: CI

# `next build` does not run ESLint (Next 16 dropped that), so a lint error can
# sit in the tree indefinitely while every build stays green. This runs the
# gates the build no longer covers, plus the build itself.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint

      # `typecheck` runs `next typegen` first: PageProps and LayoutProps are
      # globals Next writes into .next/types, so a bare `tsc` on a fresh
      # checkout cannot see them.
      - run: pnpm typecheck

      # The content layer parses every post through its zod schemas at module
      # load, so malformed content fails here rather than in production.
      - run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: https://space.gimhara.com

          # A throwaway local file, set explicitly rather than left unset.
          # `lib/db/index.ts` refuses to fall back to a file when NODE_ENV is
          # production — that guard exists so a real deployment can never
          # silently write to a disk that disappears, and it should stay strict.
          # Naming a file here is a visible CI choice, not that silent fallback.
          # The tables do not exist, every query fails, and the read paths catch
          # it and render zeros, which is all this build needs.
          TURSO_DATABASE_URL: file:ci-build.db
