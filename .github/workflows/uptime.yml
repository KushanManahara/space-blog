name: Uptime

# GitHub emails the repository owner when a scheduled run fails, so this is the
# alert for what the site cannot report about itself: being down entirely.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the site and its database
        run: |
          for path in /api/health / /articles /sitemap.xml; do
            curl --fail --silent --show-error --output /dev/null \
              --retry 3 --retry-delay 20 --retry-all-errors --max-time 30 \
              "https://space.gimhara.com$path"
            echo "ok $path"
          done
